<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calix Nike — Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">Calix <span>Nike</span></div>
      <div class="tag">Official-looking demo store</div>
    </div>
    <div class="search">
      <input id="searchInput" placeholder="Search shoes, sizes, models..." />
    </div>
    <div class="actions">
      <button id="cartBtn" class="cart-btn">🛒 Cart <span id="cartCount" class="cart-count">0</span></button>
    </div>
  </header>

  <main>
    <section class="grid" id="productsGrid"></section>
    <div id="noResults" class="no-results">No products found.</div>
  </main>

  <aside id="cartDrawer" class="drawer" aria-hidden="true">
    <h3>Your cart</h3>
    <div id="cartItems"></div>
    <div id="cartEmpty" class="empty">Your cart is empty.</div>
    <div class="checkout">
      <div>
        <div class="muted">Total</div>
        <div id="cartTotal" class="total">₱0.00</div>
      </div>
      <div class="buttons">
        <button id="checkoutBtn" class="btn">Checkout</button>
        <button id="clearBtn" class="outline">Clear</button>
      </div>
    </div>
  </aside>

  <footer>
    <a href="index.html">← Back to Home</a> • Calix Nike — Demo Store
  </footer>

  <script src="main.js"></script>
</body>
</html>
